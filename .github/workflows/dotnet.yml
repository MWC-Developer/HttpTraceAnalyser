name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'   # Matches v1.0.0, v2.1.3, etc.

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore -p:Version=${{ steps.get_version.outputs.VERSION }}

      - name: Publish
        run: dotnet publish --configuration Release --no-build -p:Version=${{ steps.get_version.outputs.VERSION }} -o ./publish

      - name: Zip artifacts
        shell: pwsh
        run: Compress-Archive -Path ./publish/* -DestinationPath ./HttpTraceAnalyser-${{ steps.get_version.outputs.VERSION }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./HttpTraceAnalyser-*.zip
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
